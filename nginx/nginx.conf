worker_processes  1;

events {
  worker_connections  1024;
}

http {
  # Keeps Cache-Control at the server level. Putting it in a location block
  # would drop the inherited security headers, since nginx only inherits
  # add_header when the inner level declares none of its own.
  map $uri $cache_control {
    default    "public, max-age=600";
    ~^/_astro/ "public, max-age=31536000, immutable";  # content-hashed
  }

  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # GitHub Pages cannot set response headers, so the Docker mirror is the
    # only deployment where these can be applied. Fronting the apex domain
    # with a CDN would be the way to get them on the Pages origin too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Cache-Control $cache_control always;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    location / {
            try_files $uri $uri/index.html =404;
    }
  }
}
